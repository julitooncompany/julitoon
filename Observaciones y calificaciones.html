<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Observaciones y calificaciones - Juli Toon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ========== FONDO ========== */
        .bg-image {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            z-index: -1;
        }
        .bg-mobile  { display: block; }
        .bg-tablet  { display: none;  }
        .bg-desktop { display: none;  }

        /* ========== CHECKBOX MENÚ ========== */
        #menu-toggle { display: none; }

        /* ========== NAV — fijo en la parte superior ========== */
        .nav-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 128px;
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 25px 16px;
        }

        .boton-menu {
            width: 76.2px;
            height: 76.2px;
            flex-shrink: 0;
        }
        .boton-menu label { display: block; width: 100%; height: 100%; cursor: pointer; }
        .boton-menu svg   { width: 100%; height: 100%; }
        .logo             { width: 102px; height: 96px; flex-shrink: 0; }
        .logo svg         { width: 100%; height: 100%; }

        /* ========== ÁREA CENTRAL — la sección azul se centra verticalmente ========== */
        .main-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 128px;
        }

        /* ========== SECCIÓN AZUL ========== */
        .seccion-form {
            width: 100%;
            background: #3fa9f5;
            padding: 36px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ========== TARJETA BLANCA ========== */
        .card {
            background: white;
            width: 100%;
            border-radius: 20px;
            padding: 36px 16px;
            display: flex;
            flex-direction: column;
            gap: 13px;
            align-items: center;
        }

        /* ========== TÍTULO ========== */
        .titulo-bloque {
            display: flex;
            flex-direction: column;
            gap: 21px;
            align-items: center;
            text-align: center;
            width: 100%;
            color: black;
        }
        .titulo-principal {
            font-size: 24px;
            font-weight: 900;
            line-height: normal;
        }
        .subtitulo {
            font-size: 16px;
            font-weight: 700;
            line-height: normal;
            max-width: 337px;
        }

        /* ========== ESTRELLAS ========== */
        .fila-estrellas {
            width: 100%;
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            padding: 14px 13px;
            flex-wrap: wrap;
        }
        .estrella {
            width: 46px;
            height: 46px;
            cursor: pointer;
            flex-shrink: 0;
            user-select: none;
            display: inline-block;
        }
        .estrella svg { width: 100%; height: 100%; display: block; }
        .estrella svg path {
            fill: transparent;
            stroke: #FCEE21;
            stroke-width: 1.43636;
            transition: fill 0.18s ease, stroke 0.18s ease;
        }
        .estrella.filled  svg path,
        .estrella.hovered svg path { fill: #FCEE21; stroke: #FCEE21; }

        @keyframes starPop {
            0%   { transform: scale(1); }
            35%  { transform: scale(1.38); }
            65%  { transform: scale(0.88); }
            82%  { transform: scale(1.12); }
            100% { transform: scale(1); }
        }
        .estrella.pop { animation: starPop 0.32s cubic-bezier(.36,.07,.19,.97); }

        /* ========== BOTÓN BORRAR ========== */
        .btn-borrar {
            background: #3fa9f5;
            border: none;
            border-radius: 60px;
            padding: 6px 13px;
            font-family: 'Figtree', sans-serif;
            font-size: 20px;
            font-weight: 900;
            color: white;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            opacity: 0;
            transform: translateX(22px) scale(0.78);
            pointer-events: none;
            transition: opacity 0.28s ease,
                        transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-borrar.visible {
            opacity: 1;
            transform: translateX(0) scale(1);
            pointer-events: auto;
        }
        .btn-borrar:active { transform: scale(0.94); }

        /* ========== TEXTAREA ========== */
        .wrap-textarea {
            width: 100%;
            padding: 26px;
            display: flex;
            justify-content: center;
        }
        .campo {
            width: 100%;
            max-width: 291px;
            height: 159px;
            border: 10px solid #2E3192;
            border-radius: 20px;
            padding: 20px;
            font-family: 'Figtree', sans-serif;
            font-size: 20px;
            font-weight: 900;
            color: black;
            resize: none;
            outline: none;
            background: white;
        }
        .campo::placeholder { color: black; font-weight: 900; }

        /* ========== BOTÓN ENVIAR ========== */
        .wrap-boton { padding: 9px 16px; }
        .btn-enviar {
            display: block;
            background: #3fa9f5;
            border: none;
            border-radius: 20px;
            padding: 20px;
            font-family: 'Figtree', sans-serif;
            font-size: 32px;
            font-weight: 900;
            color: white;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
        }
        .btn-enviar:hover { opacity: 0.9; transform: scale(1.02); }

        /* ========== FOOTER ========== */
        .footer-wrap {
            padding: 36px 16px;
        }
        .footer-inner {
            background: #2E3192;
            border-radius: 60px;
            padding: 25px 16px;
            text-align: center;
        }
        .footer-texto {
            font-size: 32px;
            font-weight: 900;
            color: white;
            white-space: nowrap;
            line-height: normal;
        }

        /* ========== TABLET — 768px+ ========== */
        @media screen and (min-width: 768px) {
            .bg-mobile  { display: none;  }
            .bg-tablet  { display: block; }
            .bg-desktop { display: none;  }

            .nav-menu      { padding: 25px 100px; }
            .seccion-form  { padding: 36px 100px; }
            .subtitulo     { max-width: 602px; }
            .wrap-textarea { justify-content: stretch; }
            .campo         { max-width: 100%; }
            .footer-wrap   { padding: 36px 100px; }
        }

        /* ========== DESKTOP — 1024px+ ========== */
        @media screen and (min-width: 1024px) {
            .bg-mobile  { display: none;  }
            .bg-tablet  { display: none;  }
            .bg-desktop { display: block; }

            .nav-menu      { padding: 25px 200px; }
            .seccion-form  { padding: 36px 200px; }
            .subtitulo     { max-width: 1008px; }
            .wrap-textarea { justify-content: stretch; }
            .campo         { max-width: 100%; }
            .wrap-boton    { padding: 9px 98px; }
            .footer-wrap   { padding: 36px 200px; }
        }

        /* ========== MENÚ HAMBURGUESA (CSS puro) ========== */
        .menu-nav {
            position: fixed;
            inset: 0;
            background: #fcee21;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateX(-100%);
            opacity: 0;
            visibility: hidden;
            transition: transform .4s cubic-bezier(.4,0,.2,1),
                        opacity .35s ease,
                        visibility 0s linear .4s;
        }
        #menu-toggle:checked ~ .menu-nav {
            transform: translateX(0);
            opacity: 1;
            visibility: visible;
            transition: transform .4s cubic-bezier(.4,0,.2,1),
                        opacity .35s ease,
                        visibility 0s linear 0s;
        }
        #menu-toggle:checked ~ .menu-nav .menu-item:nth-child(1) { animation: mIn .35s ease .15s both; }
        #menu-toggle:checked ~ .menu-nav .menu-item:nth-child(2) { animation: mIn .35s ease .23s both; }
        #menu-toggle:checked ~ .menu-nav .menu-item:nth-child(3) { animation: mIn .35s ease .31s both; }
        @keyframes mIn {
            from { opacity: 0; transform: translateX(-30px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        .menu-frame {
            display: flex;
            flex-direction: column;
            gap: 37px;
            align-items: flex-start;
            width: 439px;
            max-width: 90%;
        }
        .menu-item {
            display: inline-grid;
            grid-template-columns: max-content;
            grid-template-rows: max-content;
            place-items: start;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            transition: transform .2s ease;
        }
        .menu-item:hover { transform: translateX(10px); }
        .menu-icon { grid-column:1; grid-row:1; width:107px; height:107px; }
        .menu-text {
            grid-column:1; grid-row:1;
            font-family: 'Figtree', sans-serif;
            font-weight: 900;
            font-size: 71px;
            color: #2e3192;
            white-space: nowrap;
            margin-left: 107px;
            margin-top: 10px;
            line-height: normal;
        }
        .btn-cerrar {
            position: absolute;
            top: 25px; right: 5.5%;
            width: 89px; height: 89px;
            background: none; border: none; padding: 0;
            cursor: pointer;
            transition: transform .2s ease;
        }
        .btn-cerrar:hover { transform: rotate(90deg); }
        .btn-cerrar label { display:block; width:100%; height:100%; cursor:pointer; }

        @media screen and (max-width: 767px) {
            .menu-frame { gap:25.916px; width:330px; max-width:88%; }
            .menu-icon  { width:79.476px; height:79.476px; }
            .menu-text  { font-size:61.335px; margin-left:75.16px; margin-top:4.32px; }
            .btn-cerrar { right:14px; }
        }
    </style>
</head>

    <script>
        const stars     = document.querySelectorAll('.estrella');
        const btnBorrar = document.getElementById('btnBorrar');
        let rating = 0;

        stars.forEach(function(s) {
            s.addEventListener('click', function() {
                rating = +s.dataset.v;
                paint(rating);
                btnBorrar.classList.toggle('visible', rating > 0);
                // animación de rebote al seleccionar
                s.classList.remove('pop');
                void s.offsetWidth;
                s.classList.add('pop');
                s.addEventListener('animationend', function() {
                    s.classList.remove('pop');
                }, { once: true });
            });
            s.addEventListener('mouseenter', function() {
                var v = +s.dataset.v;
                stars.forEach(function(st) {
                    var sv = +st.dataset.v;
                    st.classList.toggle('filled',  sv <= rating);
                    st.classList.toggle('hovered', sv > rating && sv <= v);
                });
            });
            s.addEventListener('mouseleave', function() {
                stars.forEach(function(st) { st.classList.remove('hovered'); });
                paint(rating);
            });
        });

        btnBorrar.addEventListener('click', function() {
            rating = 0;
            paint(0);
            btnBorrar.classList.remove('visible');
        });

        function paint(val) {
            stars.forEach(function(s) {
                s.classList.toggle('filled', +s.dataset.v <= val);
                s.classList.remove('hovered');
            });
        }

        function prepEnvio() {
            document.getElementById('inputCalif').value = rating ? rating + ' estrella' + (rating > 1 ? 's' : '') : 'Sin calificacion';
            document.getElementById('inputObs').value   = document.getElementById('campoObs').value;
        }
    </script>
