<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educación - Juli Toon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            overflow-x: hidden;
        }

        /* ─── Header ─── */
        .header {
            background-color: #3FA9F5;
            padding: 25px 100px;
            display: flex;
            align-items: center;
            position: relative;
            top: 0;
            z-index: 100;
            overflow: hidden;
        }

        .back-btn {
            display: block;
            width: 148px;
            height: 148px;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s ease;
            text-decoration: none;
        }

        .back-btn:hover {
            transform: scale(1.07);
        }

        .back-btn svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ─── Sections ─── */
        .section {
            width: 100%;
        }

        .section-inner {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 117px;
            padding: 36px 200px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }

        .section-inner::-webkit-scrollbar {
            height: 6px;
        }

        .section-inner::-webkit-scrollbar-track {
            background: transparent;
        }

        .section-inner::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.25);
            border-radius: 3px;
        }

        .section-1 { background-color: #2E3192; }
        .section-2 { background-color: #FCEE21; }
        .section-3 { background-color: #7AC943; }

        .cert-img {
            flex-shrink: 0;
            display: block;
            object-fit: cover;
        }

        /* Desktop image sizes */
        .section-1 .cert-img { width: 800px; height: 1131px; }
        .section-2 .cert-img { width: 800px; height: 566px; }
        .section-3 .cert-img { width: 800px; height: 619px; }

        /* ─── Tablet (768px – 1024px) ─── */
        @media (max-width: 1024px) and (min-width: 768px) {
            .header {
                padding: 25px 100px;
            }

            .back-btn {
                width: 118px;
                height: 118px;
            }

            .section-inner {
                gap: 68px;
                padding: 36px 100px;
            }

            .section-1 .cert-img { width: 463px; height: 655px; }
            .section-2 .cert-img { width: 463px; height: 327px; }
            .section-3 .cert-img { width: 463px; height: 358px; }
        }

        /* ─── Mobile (≤767px) ─── */
        @media (max-width: 767px) {
            .header {
                padding: 25px 16px;
            }

            .back-btn {
                width: 66px;
                height: 66px;
            }

            .section-inner {
                gap: 44px;
                padding: 36px 16px;
            }

            .section-3 .section-inner {
                padding-top: 24px;
                padding-bottom: 24px;
            }

            .section-1 .cert-img { width: 300px; height: 424px; }
            .section-2 .cert-img { width: 300px; height: 212px; }
            .section-3 .cert-img { width: 300px; height: 232px; }
        }
    </style>
</head>
<body>

    <!-- ─── Header ─── -->
    <header class="header">
        <a href="index.html" class="back-btn" aria-label="Volver a inicio">
            <!-- Single SVG scaled via CSS — viewBox anchored to 148×148 desktop paths -->
            <svg fill="none" viewBox="0 0 148 148" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <clipPath id="clip-edu">
                        <rect width="148" height="148"/>
                    </clipPath>
                </defs>
                <g clip-path="url(#clip-edu)">
                    <!-- Diamond shape -->
                    <path d="M133.753 39.5709L108.447 14.2648C89.4271 -4.75468 58.5904 -4.75468 39.5708 14.2648L14.2648 39.5709C-4.75475 58.5904 -4.75475 89.4272 14.2648 108.447L39.5708 133.753C58.5904 152.772 89.4271 152.772 108.447 133.753L133.753 108.447C152.772 89.4272 152.772 58.5904 133.753 39.5709Z" fill="#2E3192"/>
                    <!-- Arrow (left) -->
                    <mask id="mask-edu" maskUnits="userSpaceOnUse" style="mask-type:alpha" x="26" y="26" width="96" height="96">
                        <rect x="26.9091" y="26.9091" width="94.1818" height="94.1818" fill="#D9D9D9"/>
                    </mask>
                    <g mask="url(#mask-edu)">
                        <path d="M57.6163 77.9242L79.592 99.9L74 105.394L42.6061 74L74 42.6061L79.592 48.1L57.6163 70.0758H105.394V77.9242H57.6163Z" fill="#FCEE21"/>
                    </g>
                </g>
            </svg>
        </a>
    </header>

    <!-- ─── Section 1: Azul oscuro ─── -->
    <section class="section section-1">
        <div class="section-inner">
            <img class="cert-img"
                 src="Julian Mignoni diseño web-01.jpg"
                 alt="Julian Mignoni diseño web" />
            <img class="cert-img"
                 src="Certificado del curso de diseño gráfico-01.jpg"
                 alt="Certificado del curso de diseño gráfico" />
        </div>
    </section>

    <!-- ─── Section 2: Amarillo ─── -->
    <section class="section section-2">
        <div class="section-inner">
            <img class="cert-img"
                 src="DIPLOMA CapCut Julián Mignoni-01.jpg"
                 alt="Diploma CapCut Julián Mignoni" />
            <img class="cert-img"
                 src="Julián Mignoni (1).jpg"
                 alt="Julián Mignoni diploma" />
        </div>
    </section>

    <!-- ─── Section 3: Verde ─── -->
    <section class="section section-3">
        <div class="section-inner">
            <img class="cert-img"
                 src="Certificado-Introducción-a-UX-EducaciónIT-01.jpg"
                 alt="Certificado Introducción a UX EducaciónIT" />
            <img class="cert-img"
                 src="Certificado-Desarrollo-Web-con-HTML-EducaciónIT (1).jpeg"
                 alt="Certificado Desarrollo Web con HTML EducaciónIT" />
        </div>
    </section>

</body>
</html>
