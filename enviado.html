<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviado - Juli Toon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@900&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #2e3192;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 36px 16px;
        }

        .contenido {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 29px;
            width: 100%;
            max-width: 1040px;
        }

        .check-icon {
            flex-shrink: 0;
            /* Mobile: 118px, scales up on larger screens */
            width: clamp(118px, 20vw, 300px);
            height: clamp(118px, 20vw, 300px);
        }

        .check-icon svg {
            width: 100%;
            height: 100%;
        }

        .mensaje {
            font-family: 'Figtree', sans-serif;
            font-weight: 900;
            font-size: clamp(24px, 3.5vw, 40px);
            color: white;
            text-align: center;
            line-height: normal;
            word-break: break-word;
        }

        /* Mobile: checkmark smaller */
        @media (max-width: 767px) {
            .check-icon {
                width: 118px;
                height: 118px;
            }
            .mensaje {
                font-size: 28px;
            }
        }

        /* Tablet */
        @media (min-width: 768px) and (max-width: 1199px) {
            body {
                padding: 36px 100px;
            }
            .check-icon {
                width: 300px;
                height: 300px;
            }
            .mensaje {
                font-size: 32px;
            }
        }

        /* Desktop */
        @media (min-width: 1200px) {
            body {
                padding: 36px 200px;
            }
            .check-icon {
                width: 300px;
                height: 300px;
            }
            .mensaje {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="contenido">
        <!-- Checkmark icon — large viewBox (300x300), scaled via CSS -->
        <div class="check-icon">
            <svg viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <mask id="checkMask" maskUnits="userSpaceOnUse" x="0" y="0" width="300" height="300" style="mask-type:alpha">
                    <rect x="0.5" y="0.5" width="299" height="299" fill="#D9D9D9" stroke="black"/>
                </mask>
                <g mask="url(#checkMask)">
                    <path d="M251.168 92.4966L119.375 224.29L48.8318 153.747L65.9373 136.641L119.375 190.079L234.062 75.3911L251.168 92.4966Z" fill="#3FA9F5" stroke="black"/>
                </g>
            </svg>
        </div>

        <p class="mensaje">Se ha enviado correctamente</p>
    </div>
</body>
</html>
