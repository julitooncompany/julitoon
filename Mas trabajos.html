<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mas trabajos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background-color: white;
            z-index: 1000;
            display: flex;
            align-items: center;
            padding: 25px 16px;
        }

        .back-button {
            display: block;
            width: 66px;
            height: 66px;
            cursor: pointer;
            transition: transform 0.3s ease;
            flex-shrink: 0;
            text-decoration: none;
        }

        .back-button:hover {
            transform: scale(1.05);
        }

        .back-button:focus {
            outline: 2px solid #2E3192;
            border-radius: 50%;
        }

        .back-button svg {
            width: 100%;
            height: 100%;
        }

        /* ===== MAIN CONTENT — celular (375px) ===== */
        .main-content {
            margin-top: 116px;
            padding: 36px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 80px;
            padding-bottom: 100px;
        }

        .title {
            font-size: 32px;
            font-weight: 900;
            color: black;
            text-align: center;
            width: 100%;
            line-height: normal;
        }

        .gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 80px;
            width: 100%;
        }

        .gallery-item {
            width: 100%;
            max-width: 300px;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* ===== CARRUSEL SECTION ===== */
        .section-carrusel {
            background-color: #3fa9f5;
            width: 100%;
            padding: 36px 16px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .carrusel-track {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 77px;
            width: max-content;
        }

        .carrusel-item {
            border-radius: 24px;
            overflow: hidden;
            flex-shrink: 0;
            width: 488.45px;
        }

        .carrusel-item img {
            width: 100%;
            height: 375.76px;
            display: block;
            object-fit: cover;
            border-radius: 24px;
        }

        .carrusel-placeholder {
            background-color: white;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 280px;
            height: 200px;
            flex-shrink: 0;
        }

        .carrusel-placeholder p {
            font-family: 'Figtree', sans-serif;
            font-weight: 900;
            color: #2E3192;
            font-size: 22px;
            white-space: nowrap;
        }

        /* ===== TABLET — 768px+ ===== */
        @media screen and (min-width: 768px) {
            .header {
                padding: 25px 100px;
            }

            .back-button {
                width: 118px;
                height: 118px;
            }

            .main-content {
                margin-top: 168px;
                padding: 36px 100px;
                gap: 120px;
            }

            .title {
                font-size: 64px;
            }

            .gallery {
                gap: 120px;
            }

            .gallery-item {
                max-width: 470px;
            }

            .section-carrusel {
                padding: 36px 100px;
            }

            .carrusel-track {
                gap: 118px;
            }

            .carrusel-item {
                width: 420px;
            }

            .carrusel-placeholder {
                width: 420px;
                height: 290px;
            }

            .carrusel-placeholder p {
                font-size: 40px;
            }
        }

        /* ===== DESKTOP — 1024px+ ===== */
        @media screen and (min-width: 1024px) {
            .header {
                padding: 25px 100px;
            }

            .back-button {
                width: 148px;
                height: 148px;
            }

            .main-content {
                margin-top: 198px;
                padding: 36px 200px;
                gap: 215px;
            }

            .title {
                font-size: 96px;
            }

            .gallery {
                gap: 215px;
            }

            .gallery-item {
                max-width: 830px;
            }

            .section-carrusel {
                padding: 36px 200px;
            }

            .carrusel-track {
                gap: 153px;
            }

            .carrusel-item {
                width: 580px;
                border-radius: 48px;
            }

            .carrusel-item img {
                border-radius: 48px;
            }

            .carrusel-placeholder {
                width: 580px;
                height: 430px;
                border-radius: 48px;
            }

            .carrusel-placeholder p {
                font-size: 56px;
            }
        }

        /* ===== FLUID TRANSITIONS ===== */
        @media screen and (min-width: 375px) and (max-width: 767px) {
            .back-button {
                width: calc(66px + (118 - 66) * ((100vw - 375px) / (768 - 375)));
                height: calc(66px + (118 - 66) * ((100vw - 375px) / (768 - 375)));
            }
            .title {
                font-size: calc(32px + (64 - 32) * ((100vw - 375px) / (768 - 375)));
            }
            .gallery-item {
                max-width: calc(300px + (470 - 300) * ((100vw - 375px) / (768 - 375)));
            }
        }

        @media screen and (min-width: 768px) and (max-width: 1024px) {
            .back-button {
                width: calc(118px + (148 - 118) * ((100vw - 768px) / (1024 - 768)));
                height: calc(118px + (148 - 118) * ((100vw - 768px) / (1024 - 768)));
            }
            .title {
                font-size: calc(64px + (96 - 64) * ((100vw - 768px) / (1024 - 768)));
            }
            .gallery-item {
                max-width: calc(470px + (830 - 470) * ((100vw - 768px) / (1024 - 768)));
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <a href="Trabajos.html" class="back-button" aria-label="Volver atras">
            <svg viewBox="0 0 148 148" fill="none" xmlns="http://www.w3.org/2000/svg">

                    <mask id="mask0_mas" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="26" y="26" width="96" height="96">
                        <rect x="26.9091" y="26.9091" width="94.1818" height="94.1818" fill="#D9D9D9"/>
                    </mask>
                    <g mask="url(#mask0_mas)">
                        <path d="M57.6163 77.9242L79.592 99.9L74 105.394L42.6061 74L74 42.6061L79.592 48.1L57.6163 70.0758H105.394V77.9242H57.6163Z" fill="#FCEE21"/>
                    </g>
                </g>
                <defs>
                    <clipPath id="clip0_mas">
                        <rect width="148" height="148" fill="white"/>

    </header>
